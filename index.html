<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Auto-upgrade HTTP -> HTTPS (needed for WebCrypto PIN unlock).
    // Local dev (localhost) stays on HTTP so `python3 -m http.server` still works.
    if (window.location.protocol === 'http:') {
      var host = window.location.hostname;
      if (host !== 'localhost' && host !== '127.0.0.1' && host !== '[::1]') {
        window.location.replace('https://' + window.location.host + window.location.pathname + window.location.search + window.location.hash);
      }
    }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <meta name="theme-color" content="#ffffff">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>RS1 Recordings</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="manifest" href="app.webmanifest">
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>
  <div id="app"></div>
  <script src="app.js"></script>
  <script>
    // Offline support: the service worker caches the app and, on request,
    // every encrypted recording, so playback works with no connection.
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('service-worker.js').catch(function () {});
      });
    }
  </script>
</body>
</html>
